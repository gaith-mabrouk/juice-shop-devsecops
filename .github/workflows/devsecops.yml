name: DevSecOps Pipeline

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  semgrep:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Determine baseline commit
        id: baseline
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASELINE_COMMIT="${{ github.event.pull_request.base.sha }}"
          else
            BASELINE_COMMIT="${{ github.event.before }}"
          fi

          echo "Baseline commit: $BASELINE_COMMIT"
          echo "commit=$BASELINE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Run Semgrep differential scan
        run: |
          semgrep scan \
            --config=auto \
            --baseline-commit "${{ steps.baseline.outputs.commit }}" \
            --error
  gitleaks:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version     

      - name: Run Gitleaks differential scan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASELINE_COMMIT="${{ github.event.pull_request.base.sha }}"
          else
            BASELINE_COMMIT="${{ github.event.before }}"
          fi

          echo "Baseline commit: $BASELINE_COMMIT"

          gitleaks git \
            --log-opts="${BASELINE_COMMIT}..${{ github.sha }}" \
            --redact          